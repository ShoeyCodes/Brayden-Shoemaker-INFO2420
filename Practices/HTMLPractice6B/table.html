<!DOCTYPE html>
<html>


<head>

<meta charset="UTF-8">
	
<title>HTML Practice 6B - Tables</title>

<style type="text/css">

table, td, tr, th {
   border: 1px solid rgb(0, 0, 0);
   padding: 5px;
}

td {
   background-color: white;
}

.center {
   text-align: center;
}

.width {
   margin: auto;
   width: 550px;
}

.caption {
   font-size: 20px;
   font-weight: bold;
   color: rgb(7, 97, 7);
}

.columnheading {
   background-color: lightgrey;
   width: 25%;
}

.days {
   background-color: greenyellow;
}


</style>
</head>


<body>

<div class="center">
   <table class="width">
      <caption class="caption"><strong>My Class Schedule</strong></caption>
      <colgroup class="columnheading"></colgroup>
      <colgroup class="days" span="5"></colgroup>


      <tr>
         <th>Courses</th>
         <th>Monday</th>
         <th>Tuesday</th>
         <th>Wednesday</th>
         <th>Thursday</th>
         <th>Friday</th>
      </tr>
      
      <tr>
         <th><strong>INFO 1120</strong></th> <td></td> <td>9-11</td> <td></td> <td>9-11</td> <td rowspan="2"></td>
      </tr>

      <tr>
         <th><strong>MATH 1010</strong></th> <td colspan="4">12-1</td>
      </tr>

      <tr>
         <th><strong>INFO 2420</strong></th> <td colspan="5">Online Available 24/7</td>
      </tr>



   </table>
</div>



</body>
</html>
