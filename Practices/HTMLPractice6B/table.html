<!DOCTYPE html>
<html>


<head>

<meta charset="UTF-8">
	
<title>HTML Practice 6B - Tables</title>

<style type="text/css">

table, td, tr {
   border: 1px black;
}

.center {
   text-align: center;
}

.width {
   margin: auto;
   width: 550px;
}

.caption {
   font-size: 20px;
   font-weight: bold;
   color: rgb(7, 97, 7);
}

</style>
</head>


<body>

<div class="center">
   <table class="width">
      <caption class="caption"><strong>My Class Schedule</strong></caption>

      <th>Courses</th>
      <th>Monday</th>
      <th>Tuesday</th>
      <th>Wednesday</th>
      <th>Thursday</th>
      <th>Friday</th>

      <th>

      </th>



   </table>
</div>



</body>
</html>
