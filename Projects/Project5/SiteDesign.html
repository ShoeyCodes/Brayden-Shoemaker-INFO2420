<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Extreme Honeymoons Site Design</title>

<style>
body{
    font-family: Arial, Helvetica, sans-serif;
    background-color: #f4f4f4;
    margin: 40px;
}

h1{
    text-align:center;
}

.palette{
    display:flex;
    gap:20px;
    justify-content:center;
    margin-top:40px;
}

.color-box{
    width:180px;
    height:180px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-weight:bold;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.gold{ background:#C9A227; }
.deep-green{ background:#1B4332; }
.burnt-orange{ background:#D97706; }
.stone{ background:#6B7280; }
.midnight{ background:#0F172A; }

</style>
</head>

<body>

<h1>Extreme Honeymoons Website Design</h1>

<h2 style="text-align:center;">Luxury Adventure Color Palette</h2>

<div class="palette">

<div class="color-box gold">
#C9A227<br>Gold
</div>

<div class="color-box deep-green">
#1B4332<br>Deep Forest
</div>

<div class="color-box burnt-orange">
#D97706<br>Adventure Orange
</div>

<div class="color-box stone">
#6B7280<br>Mountain Stone
</div>

<div class="color-box midnight">
#0F172A<br>Midnight Sky
</div>

</div>

</body>
</html>
